# Builds the FatBoss cgame for every client platform and packs it into one
# zzz_fatboss_<version>.pk3. That pk3 goes next to the official legacy_v*.pk3
# on a server running the official ET: Legacy mod of the same version.
#
# The version below must match the server's mod exactly (legacy_v2.86.0.pk3).
# A player whose platform is missing from the pk3 fails the sv_pure check,
# so the package job refuses to publish without the required platforms.
name: FatBoss cgame

on:
  push:
    branches: [fatboss]
    paths:
      - "src/cgame/**"
      - "src/game/bg_*"
      - "src/ui/**"
      - "fatboss/**"
      - ".github/workflows/fatboss.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  CI_ETL_DESCRIBE: v2.86.0
  CI_ETL_TAG: v2.86.0

jobs:
  lnx64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: maus007/docker-run-action-fork@v1
        with:
          image: etlegacy/lnx-build:latest
          options: -v ${{ github.workspace }}:/code -e CI_ETL_DESCRIBE=${{ env.CI_ETL_DESCRIBE }} -e CI_ETL_TAG=${{ env.CI_ETL_TAG }} -e CI=true
          run: |
            git config --global --add safe.directory /code
            ./easybuild.sh build -64 -mod
      - uses: actions/upload-artifact@v4
        with:
          name: cgame-lnx64
          path: build/legacy/cgame*.so
          if-no-files-found: error

  lnx32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: maus007/docker-run-action-fork@v1
        with:
          image: etlegacy/lnx-build:latest
          options: -v ${{ github.workspace }}:/code -e CI_ETL_DESCRIBE=${{ env.CI_ETL_DESCRIBE }} -e CI_ETL_TAG=${{ env.CI_ETL_TAG }} -e CI=true
          run: |
            git config --global --add safe.directory /code
            ./easybuild.sh build -mod
      - uses: actions/upload-artifact@v4
        with:
          name: cgame-lnx32
          path: build/legacy/cgame*.so
          if-no-files-found: error

  lnx-aarch64:
    runs-on: ubuntu-24.04
    container:
      image: etlegacy/lnx-aarch64-build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./easybuild.sh build -RPIT -mod -ninja
      - uses: actions/upload-artifact@v4
        with:
          name: cgame-lnx-aarch64
          path: build/legacy/cgame*.so
          if-no-files-found: error

  osx:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: brew bundle
      - shell: bash
        env:
          SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
          DEVELOPER_DIR: /Library/Developer/CommandLineTools
        run: ./easybuild.sh build -64 -mod --osx=10.10 --osx-arc="x86_64;arm64" -j
      - uses: actions/upload-artifact@v4
        with:
          name: cgame-osx
          path: build/legacy/cgame_mac
          if-no-files-found: error

  win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - shell: cmd
        run: call .\easybuild.bat build -mod
      - uses: actions/upload-artifact@v4
        with:
          name: cgame-win32
          path: build/legacy/cgame*.dll
          if-no-files-found: error

  win64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - shell: cmd
        run: call .\easybuild.bat build -mod -64
      - uses: actions/upload-artifact@v4
        with:
          name: cgame-win64
          path: build/legacy/cgame*.dll
          if-no-files-found: error

  # Android players are rare, so a failure here does not block the pk3;
  # the package job lists what is missing.
  android:
    runs-on: ubuntu-24.04
    continue-on-error: true
    container:
      image: etlegacy/android-build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Build JoyStick dependency
        working-directory: ./app/libs/joystick
        run: |
          ./gradlew clean assembleRelease publishToMavenLocal --stacktrace
      - name: Build native libraries (no APK signing needed)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./gradlew stripReleaseDebugSymbols --stacktrace
          mkdir -p out
          find app/build/intermediates -path '*stripped_native_libs*' -name 'libcgame*.so' -exec cp {} out/ \;
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: cgame-android
          path: out/libcgame*.so
          if-no-files-found: error

  # The weapon skins change rarely and are big, so they have their own version
  # (fatboss/skins/VERSION) and release; players keep their copies across
  # cgame releases. Every theme is a pk3 of its own named after its contents
  # (zzz_fatboss_skin_<theme>_<hash>.pk3), the scratch masks with env.jpg
  # another (zzz_fatboss_wear_<hash>.pk3): a release that adds or changes one
  # theme leaves every other pk3 name the same, so players download only what
  # is new. A pk3 an earlier release already has is taken from that release
  # byte for byte: the same name must always be the same file, or players'
  # cached copies stop matching. A published release is never rebuilt.
  skins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: fatboss
      - name: Pack and publish the skins pk3s
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ver=$(tr -d ' \r\n' < fatboss/skins/VERSION)
          tag="fatboss-skins-${ver}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already published, not rebuilding it"
            exit 0
          fi
          # each pk3 under 32 MiB: the UDP download fallback stalls for good past that
          limit=$((32 * 1024 * 1024))
          root=fatboss/pk3-skins
          # the game refuses file names of MAX_QPATH (64) characters or more
          long=$(cd "$root" && find . -type f | sed 's#^\./##' | awk 'length($0) >= 64')
          if [ -n "$long" ]; then
            echo "::error::paths the game would not load (64 characters or more):"; echo "$long"; exit 1
          fi
          # pk3s of earlier skins releases, by name
          declare -A known=()
          for rel in $(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' | grep '^fatboss-skins-' || true); do
            for a in $(gh release view "$rel" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -E '^zzz_fatboss_(skin|wear)_.*\.pk3$' || true); do
              known[$a]=$rel
            done
          done
          find "$root" -type f -exec touch -d '2026-01-01 00:00:00 UTC' {} +
          : > packed.txt
          : > skins.txt
          assets=()
          pack() { # <prefix> <list file>
            local list=$2 hash pk3
            LC_ALL=C sort -u -o "$list" "$list"
            hash=$(cd "$root" && xargs -d '\n' sha256sum < "$list" | sha256sum | cut -c1-10)
            pk3="${1}_${hash}.pk3"
            if [ -n "${known[$pk3]:-}" ]; then
              gh release download "${known[$pk3]}" -R "$GITHUB_REPOSITORY" -p "$pk3" -p "$pk3.sha256"
              sha256sum -c --quiet "$pk3.sha256"
              echo "$pk3: the same as in ${known[$pk3]}"
            else
              # fixed order and timestamps
              (cd "$root" && zip -q -X -9 "../../$pk3" -@) < "$list"
              sha256sum "$pk3" > "$pk3.sha256"
              echo "$pk3: new"
            fi
            size=$(stat -c %s "$pk3")
            if [ "$size" -ge "$limit" ]; then
              echo "::error::$pk3 is $size bytes; players could never finish it over UDP (limit $limit)"
              exit 1
            fi
            cat "$list" >> packed.txt
            echo "$pk3" >> skins.txt
            assets+=("$pk3" "$pk3.sha256")
            echo "  $size bytes"
          }
          # the scratch masks every skin shares, and the reflection map
          list=$(mktemp)
          (cd "$root" && find fbs/wear -type f) > "$list"
          echo models/fatboss/skins/env.jpg >> "$list"
          pack zzz_fatboss_wear "$list"
          for shader in "$root"/scripts/fatboss_skins_*.shader; do
            t=$(basename "$shader" .shader)
            t=${t#fatboss_skins_}
            list=$(mktemp)
            echo "scripts/fatboss_skins_$t.shader" > "$list"
            (cd "$root" && find "models/fatboss/skins/$t" -type f) >> "$list"
            if [ -d "$root/fbs/$t" ]; then (cd "$root" && find "fbs/$t" -type f) >> "$list"; fi
            pack "zzz_fatboss_skin_$t" "$list"
          done
          # every file of the skins tree must be in a pk3
          missing=$(comm -23 <(cd "$root" && find . -type f | sed 's#^\./##' | LC_ALL=C sort) <(LC_ALL=C sort -u packed.txt))
          if [ -n "$missing" ]; then
            echo "::error::files in no skins pk3:"; echo "$missing"; exit 1
          fi
          sha256sum skins.txt > skins.txt.sha256
          cat skins.txt
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "FatBoss skins ${ver}" --notes "FatBoss weapon skins ${ver}, built from ${GITHUB_SHA}: one pk3 per theme plus the wear masks, see skins.txt" \
            "${assets[@]}" skins.txt skins.txt.sha256

  package:
    runs-on: ubuntu-24.04
    needs: [lnx64, lnx32, lnx-aarch64, osx, win32, win64, android]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: fatboss
      - uses: actions/download-artifact@v4
        with:
          pattern: cgame-*
          path: platforms
          merge-multiple: true
      - name: Pack pk3
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          ver=$(tr -d ' \r\n' < fatboss/VERSION)
          pk3="zzz_fatboss_${ver}.pk3"
          ls -la platforms
          # names must match the official legacy pk3 exactly
          required="cgame.mp.x86_64.so cgame_mp_x86.dll cgame_mp_x64.dll"
          optional="cgame.mp.i386.so cgame.mp.aarch64.so cgame_mac libcgame.mp.android.arm64-v8a.so libcgame.mp.android.i386.so libcgame.mp.android.x86_64.so"
          missing=""
          for f in $required; do [ -f "platforms/$f" ] || missing="$missing $f"; done
          if [ -n "$missing" ]; then echo "::error::required cgame missing:$missing"; exit 1; fi
          included=""; absent=""
          for f in $required $optional; do
            if [ -f "platforms/$f" ]; then included="$included $f"; else absent="$absent $f"; fi
          done
          [ -z "$absent" ] || echo "::warning::players on these platforms would fail sv_pure:$absent"
          (cd platforms && zip -9 -X "../$pk3" $included)
          # models, skins, shaders, graffiti and sounds that ship with the cgame
          (cd fatboss/pk3 && zip -r -9 -X "../../$pk3" .)
          # the UDP download fallback stalls for good at 32 MiB
          size=$(stat -c %s "$pk3")
          if [ "$size" -ge $((32 * 1024 * 1024)) ]; then
            echo "::error::$pk3 is $size bytes; players could never finish it over UDP"
            exit 1
          fi
          sha256sum "$pk3" | tee "$pk3.sha256"
          {
            echo "pk3: $pk3"
            echo "et:legacy: $CI_ETL_DESCRIBE"
            echo "commit: $GITHUB_SHA"
            echo "included:$included"
            echo "missing:${absent:- none}"
          } > "$pk3.txt"
          cat "$pk3.txt"
          echo "pk3=$pk3" >> "$GITHUB_OUTPUT"
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.pk3 }}
          path: |
            ${{ steps.pack.outputs.pk3 }}
            ${{ steps.pack.outputs.pk3 }}.sha256
            ${{ steps.pack.outputs.pk3 }}.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="fatboss-${{ steps.pack.outputs.ver }}"
          pk3="${{ steps.pack.outputs.pk3 }}"
          # a published release is never replaced: players cache the pk3 by its
          # name, so a rebuilt file under the same name would stop matching
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::$tag is already published and stays as it is; bump fatboss/VERSION to publish this build"
            exit 0
          fi
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$pk3" --notes-file "$pk3.txt" "$pk3" "$pk3.sha256" "$pk3.txt"
